name: 每日市场地图 - 自动抓取并部署

on:
  schedule:
    # 每半小时自动执行一次（UTC 时间每小时的 0 分和 30 分）
    # 北京时间 08:00 开始（对应 UTC 00:00），覆盖亚洲+美股交易时段
    - cron: '0,30 * * * *'
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ main ]

permissions:
  contents: write  # 改为 write，允许 commit 新数据回仓库
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 lxml

      - name: 配置 Git
        run: |
          git config user.name "Market Map Bot"
          git config user.email "actions@github.com"

      - name: 抓取今日数据（已有高质量数据则跳过）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          TODAY=$(date -u -d "+8 hours" +%Y-%m-%d)
          if [ -f "data/${TODAY}.json" ]; then
            CHAIN_COUNT=$(python3 -c "import json; d=json.load(open('data/${TODAY}.json')); print(len(d.get('chains',[])))" 2>/dev/null || echo "0")
            TABLE_COUNT=$(python3 -c "import json; d=json.load(open('data/${TODAY}.json')); print(len(d.get('four_column_table',[])))" 2>/dev/null || echo "0")
            echo "已有数据: chains=${CHAIN_COUNT}, table_rows=${TABLE_COUNT}"
            if [ "$CHAIN_COUNT" -ge 4 ]; then
              echo "✅ 数据质量达标（chains>=4），跳过重新抓取"
              echo "skip_crawl=true" >> $GITHUB_ENV
            else
              echo "⚠️ 数据质量不足，重新抓取..."
              python scripts/update_daily.py --date $TODAY
            fi
          else
            echo "无数据文件，开始抓取..."
            python scripts/update_daily.py --date $TODAY
          fi
          echo "=== 数据检查 ==="
          ls -la data/ || true
          cat data/${TODAY}.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'事件:{len(d.get(\"events\",[]))} 统计:{len(d.get(\"stats\",[]))} 因果链:{len(d.get(\"chains\",[]))} 四列表:{len(d.get(\"four_column_table\",[]))} 数据源:{d.get(\"source\",\"\")}')" 2>/dev/null || echo "数据文件检查失败"

      - name: 提交新数据到仓库（跳过抓取时则跳过）
        if: env.skip_crawl != 'true'
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "无新数据需要提交"
          else
            git commit -m "data: 更新 $(date -u -d '+8 hours' +%Y-%m-%d) 市场地图数据

            由 GitHub Actions 自动生成
            数据源: 多源RSS聚合 (CNBC/MarketWatch/Investing.com + 华尔街见闻)"
            git push
            echo "✅ 新数据已提交到仓库"
          fi

      - name: 构建静态网站
        run: |
          python scripts/build_static.py

      - name: 双语质量校验
        run: |
          echo "=== 双语质量校验 ==="
          python -c "
          import json, glob, re, sys

          chinese_re = re.compile(r'[\u4e00-\u9fff]')
          field_pairs = [
              ('label', 'label_en'), ('change', 'change_en'),
              ('event', 'event_en'), ('assets', 'assets_en'), ('logic', 'logic_en'),
              ('title', 'title_en'),
              ('term', 'term_en'), ('explain', 'explain_en'),
              ('text', 'text_en'),
              ('analogy_title', 'analogy_title_en'), ('analogy_text', 'analogy_text_en'),
              ('lesson', 'lesson_en'), ('diff', 'diff_en'),
          ]

          total_issues = 0
          for f in sorted(glob.glob('data/*.json'), reverse=True):
              with open(f, 'r', encoding='utf-8') as fp:
                  data = json.load(fp)
              date_str = data.get('date', f)
              issues = []

              def check_item(item, context):
                  for zh_field, en_field in field_pairs:
                      if zh_field in item:
                          if en_field not in item or not item.get(en_field):
                              issues.append(f'{context}: missing {en_field}')
                          elif item.get(en_field) and chinese_re.search(str(item[en_field])):
                              issues.append(f'{context}: {en_field} contains Chinese characters')

              for i, s in enumerate(data.get('stats', [])):
                  check_item(s, f'[{date_str}] stats[{i}]')
              for i, e in enumerate(data.get('events', [])):
                  check_item(e, f'[{date_str}] events[{i}]')
                  for j, tag in enumerate(e.get('tags', [])):
                      if 'text' in tag and ('text_en' not in tag or not tag.get('text_en')):
                          issues.append(f'[{date_str}] events[{i}].tags[{j}]: missing text_en')
              for i, c in enumerate(data.get('chains', [])):
                  check_item(c, f'[{date_str}] chains[{i}]')
                  for j, node in enumerate(c.get('nodes', [])):
                      check_item(node, f'[{date_str}] chains[{i}].nodes[{j}]')
                  for j, jargon in enumerate(c.get('jargon', [])):
                      check_item(jargon, f'[{date_str}] chains[{i}].jargon[{j}]')
              for i, v in enumerate(data.get('verifications', [])):
                  check_item(v, f'[{date_str}] verifications[{i}]')
                  if 'vars' in v and ('vars_en' not in v or len(v.get('vars_en', [])) != len(v['vars'])):
                      issues.append(f'[{date_str}] verifications[{i}]: vars_en missing or count mismatch')

              if issues:
                  total_issues += len(issues)
                  print(f'\n⚠️ [{date_str}] {len(issues)} issues:')
                  for issue in issues[:5]:
                      print(f'  - {issue}')
                  if len(issues) > 5:
                      print(f'  ... and {len(issues) - 5} more')

          if total_issues == 0:
              print('\n✅ 双语校验通过：所有英文字段完整且无中文混入')
          else:
              print(f'\n⚠️ 共发现 {total_issues} 个双语问题')
              print('构建继续进行，但英文版本可能存在质量问题')
          "

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
