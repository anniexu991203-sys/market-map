name: 每日市场地图 - 自动抓取并部署

on:
  schedule:
    # 每半小时自动执行一次（UTC 时间每小时的 0 分和 30 分）
    # 北京时间 08:00 开始（对应 UTC 00:00），覆盖亚洲+美股交易时段
    - cron: '0,30 * * * *'
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 lxml

      - name: 抓取今日数据
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/update_daily.py --date $(date -u -d "+8 hours" +%Y-%m-%d) || echo "抓取失败，保留旧数据"

      - name: 构建静态网站
        run: |
          python scripts/build_static.py

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
